<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Agent</title>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: sans-serif;">
        <h2>Loading...</h2>
        <p id="status">Checking authentication...</p>
    </div>
    <script>
        const statusEl = document.getElementById('status');
        
        // Check if user is logged in
        const token = localStorage.getItem('authToken');
        console.log('Index.html - Auth token exists:', !!token);
        
        if (token) {
            statusEl.textContent = 'Verifying token...';
            
            // Verify token is valid
            fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                console.log('Auth verify response status:', res.status);
                return res.json();
            })
            .then(data => {
                console.log('Auth verify data:', data);
                if (data.valid) {
                    statusEl.textContent = 'Redirecting to chat...';
                    // Logged in, go to chat
                    setTimeout(() => {
                        window.location.href = '/chat.html';
                    }, 100);
                } else {
                    statusEl.textContent = 'Invalid token, redirecting to login...';
                    // Invalid token, go to onboarding
                    localStorage.removeItem('authToken');
                    setTimeout(() => {
                        window.location.href = '/onboarding.html';
                    }, 500);
                }
            })
            .catch(err => {
                console.error('Auth verification error:', err);
                statusEl.textContent = 'Error verifying token, redirecting to login...';
                // Error, go to onboarding
                setTimeout(() => {
                    window.location.href = '/onboarding.html';
                }, 500);
            });
        } else {
            console.log('No token found, redirecting to onboarding');
            statusEl.textContent = 'No login found, redirecting...';
            // Not logged in, go to onboarding
            setTimeout(() => {
                window.location.href = '/onboarding.html';
            }, 500);
        }
    </script>
</body>
</html>
