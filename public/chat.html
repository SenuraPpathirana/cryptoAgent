
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Trading AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg0:#f5f6f8;
      --bg1:#eef1f5;
      --panel: rgba(255,255,255,.9);
      --panel2: rgba(255,255,255,.98);
      --stroke: rgba(15,23,42,.10);
      --stroke2: rgba(15,23,42,.16);
      --text: rgba(15,23,42,.92);
      --muted: rgba(15,23,42,.62);
      --muted2: rgba(15,23,42,.48);
      --shadow: 0 18px 36px rgba(2,6,23,.12);
      --shadow2: 0 10px 22px rgba(2,6,23,.10);
      --r12: 12px;
      --r14: 14px;
      --r16: 16px;
      --r18: 18px;
      --r22: 22px;
      --accent:#2563eb;
      --danger:#dc2626;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(900px 600px at 12% 8%, rgba(37,99,235,.06), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
      overflow:hidden;
    }

    .app-container{
      height:100vh;
      display:flex;
      gap:16px;
      padding:16px;
    }

    .app-container.collapsed .sidebar{ width: 76px; }
    .app-container.collapsed .menu-label,
    .app-container.collapsed .brand-text,
    .app-container.collapsed .menu-text,
    .app-container.collapsed .user-info,
    .app-container.collapsed .new-chat-btn span:nth-child(2){ display:none; }
    .app-container.collapsed .new-chat-btn{ justify-content:center; }

    .sidebar{
      width: 290px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: var(--r22);
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .sidebar-header{
      padding:14px;
      border-bottom:1px solid var(--stroke);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand-mark{
      width: 36px; height:36px;
      border-radius: 12px;
      background: var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:600;
      font-size:14px;
      box-shadow: 0 8px 18px rgba(37,99,235,.22);
    }

    .brand-title{ font-size: 13.5px; font-weight:600; }
    .brand-sub{ font-size: 11.5px; color: var(--muted); }

    .icon-btn{
      width: 34px; height:34px;
      border-radius: 12px;
      border:1px solid var(--stroke2);
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .icon-btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow2); }

    .icon{ width:18px; height:18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    .new-chat-btn{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--stroke2);
      background: white;
      color: var(--text);
      border-radius: var(--r16);
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:600;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 8px 18px rgba(2,6,23,.06);
    }
    .new-chat-btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow2); }

    .sidebar-content{ flex:1; overflow:auto; padding:12px; }

    .menu-section{ margin: 6px 0 14px; }
    .menu-label{
      padding: 8px 10px;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted2);
    }

    .menu-item{
      width:100%;
      padding:12px 12px;
      border:1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: var(--r16);
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:13px;
      transition: background .15s ease, border-color .15s ease;
      margin-bottom:6px;
    }
    .menu-item:hover{ background: rgba(37,99,235,.06); border-color: rgba(37,99,235,.15); }
    .menu-item.active{ background: rgba(37,99,235,.08); border-color: rgba(37,99,235,.18); }

    .sidebar-footer{
      border-top: 1px solid var(--stroke);
      padding: 12px;
      background: var(--panel);
    }

    .user-profile{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      border-radius: var(--r16);
      border:1px solid var(--stroke);
      background: white;
      cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      color: var(--text);
      text-align:left;
    }
    .user-profile:hover{ transform: translateY(-1px); box-shadow: var(--shadow2); }

    .user-avatar{
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      font-size: 13px;
      color: white;
    }

    .user-name{ font-size: 13px; font-weight:600; }
    .user-email{ font-size: 12px; color: var(--muted); }

    .logout-btn{
      width:100%;
      padding: 10px;
      background: rgba(220,38,38,.08);
      color: var(--danger);
      border: 1px solid rgba(220,38,38,.20);
      border-radius: var(--r16);
      cursor:pointer;
      font-size:13px;
      margin-top:10px;
      transition: transform .15s ease, box-shadow .15s ease;
      font-weight:600;
    }
    .logout-btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow2); }

    .main-content{
      flex:1;
      display:flex;
      flex-direction:column;
      border-radius: var(--r22);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: var(--panel);
      box-shadow: var(--shadow);
      min-width: 0;
      position: relative;
    }

    .header{
      padding: 18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      background: var(--panel2);
      border-bottom: 1px solid var(--stroke);
    }

    .header h1{ font-size: 16px; font-weight:600; }
    .sub{ font-size: 12px; color: var(--muted); margin-top: 4px; }

    .trading-mode{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .mode-toggle{
      user-select:none;
      background: white;
      border: 1px solid var(--stroke2);
      padding: 6px 10px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      font-size: 12px;
      color: var(--text);
      font-weight:500;
    }
    .mode-toggle.active{
      background: rgba(37,99,235,.10);
      border-color: rgba(37,99,235,.30);
      color: var(--accent);
      font-weight:600;
    }

    .status-indicator{
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(37,99,235,.10);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse{
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: .8; }
    }

    .chat-area{
      flex:1;
      overflow:auto;
      padding: 18px 18px 8px;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
      scroll-behavior:smooth;
    }

    .message{
      display:flex;
      gap:12px;
      margin: 14px 0;
      animation: messageIn .22s ease;
    }
    .message.user{ flex-direction: row-reverse; }

    .message-avatar{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      flex-shrink:0;
      border: 1px solid var(--stroke);
      background: white;
      color: var(--text);
    }
    .message.bot .message-avatar{
      background: rgba(37,99,235,.12);
      border-color: rgba(37,99,235,.30);
      color: var(--accent);
    }
    .message.user .message-avatar{
      background: rgba(15,23,42,.06);
    }

    .message-content{
      max-width: min(680px, 78%);
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.55;
      color: rgba(15,23,42,.92);
      border: 1px solid var(--stroke);
      background: white;
      box-shadow: 0 8px 18px rgba(2,6,23,.06);
    }
    .message.user .message-content{
      background: rgba(37,99,235,.06);
      border-color: rgba(37,99,235,.20);
    }

    .message-meta{
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted2);
    }

    .message-content ul{ margin: 8px 0 0 18px; }
    .message-content li{ color: var(--muted); font-size: 13px; }

    .goal-card{
      margin-top: 10px;
      border-radius: var(--r16);
      padding: 12px;
      background: rgba(15,23,42,.02);
      border: 1px solid var(--stroke);
    }
    .goal-card-header{
      display:flex;
      justify-content:space-between;
      margin-bottom: 8px;
      font-weight:600;
      color: rgba(15,23,42,.88);
    }
    .goal-card-details{ font-size: 13px; color: var(--muted); }
    .goal-status{
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke2);
      background: white;
      font-size: 11px;
      color: rgba(15,23,42,.80);
      font-weight:600;
    }

    .typing-indicator{
      display:none;
      align-items:center;
      gap:6px;
      padding: 10px 12px;
      border-radius: 999px;
      width: fit-content;
      border: 1px solid var(--stroke);
      background: white;
      box-shadow: 0 8px 18px rgba(2,6,23,.06);
    }
    .typing-indicator.active{ display:flex; }

    .typing-dot{
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(15,23,42,.55);
      animation: typing 1.2s infinite;
    }
    .typing-dot:nth-child(2){ animation-delay: .15s; }
    .typing-dot:nth-child(3){ animation-delay: .30s; }
    @keyframes typing{
      0%, 60%, 100%{ transform: translateY(0); opacity:.6; }
      30%{ transform: translateY(-6px); opacity:1; }
    }

    .input-area{
      padding: 14px;
      border-top: 1px solid var(--stroke);
      background: var(--panel2);
    }

    .input-area-inner{
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
      display:flex;
      gap: 10px;
      align-items:center;
    }

    .input-wrapper{ flex:1; }

    #message-input{
      width: 100%;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 14px;
      border-radius: 16px;
      border: 1px solid var(--stroke2);
      background: white;
      color: rgba(15,23,42,.92);
      font-size: 14px;
      font-family: "Poppins", sans-serif;
      line-height: 22px;
      outline: none;
      resize:none;
      box-shadow: 0 10px 22px rgba(2,6,23,.06);
    }
    #message-input:focus{
      border-color: rgba(37,99,235,.35);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12), 0 10px 22px rgba(2,6,23,.06);
    }

    .mode-dropdown{
      position: relative;
      display:flex;
      align-items:center;
    }

    .mode-button{
      height: 40px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--stroke2);
      background: white;
      color: var(--text);
      font-weight:500;
      font-size: 13px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
      transition: transform .15s ease, box-shadow .15s ease;
      min-width: 84px;
      justify-content: space-between;
    }

    .mode-button:hover{ transform: translateY(-1px); box-shadow: var(--shadow2); }

    .mode-menu{
      position: absolute;
      bottom: 48px;
      right: 0;
      background: white;
      border: 1px solid var(--stroke2);
      border-radius: 12px;
      box-shadow: var(--shadow2);
      min-width: 120px;
      padding: 6px;
      display:none;
      z-index: 10;
    }

    .mode-menu.open{ display:block; }

    .mode-option{
      width:100%;
      padding:8px 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      text-align:left;
      cursor:pointer;
      font-size: 13px;
      font-weight:500;
      color: var(--text);
    }

    .mode-option:hover{ background: rgba(37,99,235,.08); }

    #send-button{
      height: 40px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid rgba(37,99,235,.35);
      background: var(--accent);
      color: white;
      font-weight:600;
      cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 12px 24px rgba(37,99,235,.25);
    }
    #send-button:hover{ transform: translateY(-1px); }
    #send-button:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

    .scroll-bottom{
      position: absolute;
      right: 18px;
      bottom: 90px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border:1px solid var(--stroke2);
      background: white;
      box-shadow: var(--shadow2);
      cursor:pointer;
      display:none;
      align-items:center;
      justify-content:center;
    }
    .scroll-bottom.show{ display:flex; }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(2,6,23,.35);
      z-index: 1000;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    .modal.active{ display:flex; }

    .modal-content{
      width: min(560px, 100%);
      border-radius: var(--r22);
      background: white;
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      color: var(--text);
      overflow:hidden;
    }

    .modal-header{
      padding: 16px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom: 1px solid var(--stroke);
      background: var(--panel2);
    }
    .modal-header h2{ font-size: 15px; font-weight:600; }

    .close-modal{
      width: 34px; height: 34px;
      border-radius: 12px;
      border: 1px solid var(--stroke2);
      background: white;
      color: var(--text);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
    }

    .modal-content form{ padding: 16px 18px 18px; }

    .form-group{ margin-bottom: 14px; }
    .form-group label{
      display:block;
      margin-bottom: 7px;
      color: rgba(15,23,42,.75);
      font-size: 12px;
      font-weight:600;
    }
    .form-group input, .form-group select{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      background: white;
      border: 1px solid var(--stroke2);
      color: rgba(15,23,42,.92);
      font-size: 13px;
      outline:none;
      box-shadow: 0 8px 18px rgba(2,6,23,.06);
    }
    .form-group input:focus, .form-group select:focus{
      border-color: rgba(37,99,235,.35);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12), 0 8px 18px rgba(2,6,23,.06);
    }
    .form-group small{
      display:block;
      margin-top: 6px;
      font-size: 11px;
      color: rgba(15,23,42,.58);
    }
    .form-group a{ color: var(--accent); text-decoration:none; font-weight:600; }
    .form-group a:hover{ text-decoration: underline; }

    .checkbox-group{ display:flex; align-items:center; gap:10px; }
    .checkbox-group input[type="checkbox"]{ width: 16px; height: 16px; }

    .btn-save{
      width:100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(37,99,235,.35);
      background: var(--accent);
      color:white;
      font-weight:600;
      cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 12px 24px rgba(37,99,235,.22);
    }
    .btn-save:hover{ transform: translateY(-1px); }
    .btn-save:disabled{ opacity:.6; cursor:not-allowed; box-shadow:none; }

    .status-message{
      margin: 14px 18px 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12px;
      border: 1px solid var(--stroke);
      background: rgba(37,99,235,.06);
      color: var(--text);
      font-weight:500;
    }
    .status-message.error{
      border-color: rgba(220,38,38,.35);
      background: rgba(220,38,38,.08);
      color: var(--danger);
    }

    .toast-container{
      position: fixed;
      right: 20px;
      bottom: 20px;
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index: 2000;
    }

    .toast{
      padding: 10px 14px;
      border-radius: 12px;
      background: white;
      border: 1px solid var(--stroke2);
      box-shadow: var(--shadow2);
      font-size: 13px;
      color: var(--text);
    }

    .toast.error{ border-color: rgba(220,38,38,.35); color: var(--danger); }

    .sidebar-content::-webkit-scrollbar,
    .chat-area::-webkit-scrollbar{ width: 10px; }
    .sidebar-content::-webkit-scrollbar-thumb,
    .chat-area::-webkit-scrollbar-thumb{
      background: rgba(15,23,42,.12);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }

    @media (max-width: 920px){
      .app-container{ padding:10px; gap:10px; }
      .sidebar{ width: 88px; }
      .menu-label, .brand-text, .menu-text, .user-info, .new-chat-btn span:nth-child(2){ display:none; }
      .new-chat-btn{ justify-content:center; }
    }

    @media (max-width: 720px){
      .header{ flex-direction: column; align-items:flex-start; }
      .trading-mode{ width: 100%; justify-content:flex-start; }
      .input-area-inner{ flex-direction: column; align-items: stretch; }
      .mode-dropdown, #send-button{ width: 100%; }
      .mode-button{ width: 100%; }
    }

    @keyframes messageIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="app-container" id="appContainer">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">CTA</div>
          <div class="brand-text">
            <div class="brand-title">Crypto Trading</div>
            <div class="brand-sub">AI Assistant</div>
          </div>
        </div>
        <button class="icon-btn" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h10M4 18h16" />
          </svg>
        </button>
      </div>

      <div style="padding:12px;">
        <button class="new-chat-btn" onclick="location.reload()">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New chat</span>
        </button>
      </div>

      <div class="sidebar-content">
        <div class="menu-section">
          <div class="menu-label">Configuration</div>
          <button class="menu-item active" onclick="openTelegramSettings()">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M4 5h16v10H7l-3 4V5z" />
            </svg>
            <span class="menu-text">Telegram Settings</span>
          </button>
          <button class="menu-item" onclick="openBinanceSettings()">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 3l6 6-6 6-6-6 6-6z" />
              <path d="M12 9l3 3-3 3-3-3 3-3z" />
            </svg>
            <span class="menu-text">Binance Settings</span>
          </button>
          <button class="menu-item" onclick="openTradingSettings()">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M4 14l4-4 4 4 8-8" />
            </svg>
            <span class="menu-text">Trading Preferences</span>
          </button>
        </div>

        <div class="menu-section">
          <div class="menu-label">Trading</div>
          <button class="menu-item" onclick="quickAction('Show my active goals')">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h10" />
            </svg>
            <span class="menu-text">My Goals</span>
          </button>
          <button class="menu-item" onclick="quickAction('Show open positions')">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M4 18h16M6 16V8M12 16V5M18 16v-6" />
            </svg>
            <span class="menu-text">Open Positions</span>
          </button>
          <button class="menu-item" onclick="quickAction('Check BTC price')">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M4 12h16M12 4v16" />
            </svg>
            <span class="menu-text">Check Price</span>
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="user-profile" onclick="loadUserProfile()">
          <div class="user-avatar" id="userAvatar">U</div>
          <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-email" id="userEmail"></div>
          </div>
        </button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <div>
          <h1>Crypto Trading AI Assistant</h1>
          <div class="sub">Real-time insights and goal tracking</div>
        </div>
        <div class="trading-mode">
          <div class="status-indicator"></div>
          <button class="mode-toggle" id="paperMode" onclick="setTradingMode('paper')">Paper</button>
          <button class="mode-toggle" id="liveMode" onclick="setTradingMode('live')">Live</button>
        </div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>

      <button class="scroll-bottom" id="scrollToBottom" aria-label="Scroll to bottom">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <div class="input-area">
        <div class="input-area-inner">
          <div class="mode-dropdown">
            <button class="mode-button" id="modeButton" type="button">
              <span id="modeLabel">Ask</span>
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="mode-menu" id="modeMenu">
              <button class="mode-option" data-mode="ask">Ask</button>
              <button class="mode-option" data-mode="agent">Agent</button>
            </div>
          </div>
          <div class="input-wrapper">
            <textarea id="message-input" placeholder="Ask about prices, goals, or market analysis..."></textarea>
          </div>
          <button id="send-button" onclick="sendMessage()">></button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="modal" id="telegramModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Telegram Settings</h2>
        <button class="close-modal" onclick="closeModal('telegramModal')">x</button>
      </div>
      <div id="telegramStatus"></div>
      <form id="telegramForm" onsubmit="saveTelegramSettings(event)">
        <div class="form-group">
          <label for="telegram-token">Bot Token</label>
          <input type="text" id="telegram-token" placeholder="1234567890:ABCdef" />
          <small>Get your token from <a href="https://t.me/botfather" target="_blank">BotFather</a></small>
        </div>
        <div class="form-group">
          <label for="telegram-channel">Channel ID</label>
          <input type="text" id="telegram-channel" placeholder="-1001234567890" />
          <small>Your channel ID (starts with -100)</small>
        </div>
        <button type="submit" class="btn-save">Save Changes</button>
      </form>
    </div>
  </div>

  <div class="modal" id="binanceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Binance Settings</h2>
        <button class="close-modal" onclick="closeModal('binanceModal')">x</button>
      </div>
      <div id="binanceStatus"></div>
      <form id="binanceForm" onsubmit="saveBinanceSettings(event)">
        <div class="form-group">
          <label for="binance-key">API Key</label>
          <input type="text" id="binance-key" placeholder="Your Binance API Key" />
        </div>
        <div class="form-group">
          <label for="binance-secret">API Secret</label>
          <input type="password" id="binance-secret" placeholder="Your Binance API Secret" />
          <small>Get from <a href="https://www.binance.com/en/my/settings/api-management" target="_blank">Binance API Management</a></small>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="binance-testnet" checked />
          <label for="binance-testnet">Use Testnet (recommended)</label>
        </div>
        <button type="submit" class="btn-save">Save Changes</button>
      </form>
    </div>
  </div>

  <div class="modal" id="tradingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Trading Preferences</h2>
        <button class="close-modal" onclick="closeModal('tradingModal')">x</button>
      </div>
      <div id="tradingStatus"></div>
      <form id="tradingForm" onsubmit="saveTradingSettings(event)">
        <div class="form-group">
          <label for="trading-mode-select">Trading Mode</label>
          <select id="trading-mode-select">
            <option value="paper">Paper Trading</option>
            <option value="testnet">Testnet</option>
            <option value="live">Live Trading</option>
          </select>
        </div>
        <div class="form-group">
          <label for="default-leverage">Default Leverage</label>
          <input type="number" id="default-leverage" min="1" max="125" value="10" />
        </div>
        <div class="form-group">
          <label for="max-position">Max Position Size (USDT)</label>
          <input type="number" id="max-position" min="10" step="10" value="100" />
        </div>
        <button type="submit" class="btn-save">Save Changes</button>
      </form>
    </div>
  </div>
  <script>
    let tradingMode = 'paper';
    let ws = null;
    let sessionId = 'session_' + Math.random().toString(36).substring(7);
    let authToken = localStorage.getItem('authToken');
    let currentUser = null;
    let agentRunning = false;
    let chatMode = 'ask';

    console.log('Chat.html loaded. Auth token exists:', !!authToken);

    if (!authToken) {
      window.location.href = '/';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUserProfile();
      setTradingMode('paper');
      connectWebSocket();
      scrollToBottom();
      enableAutoGrowTextarea();
      setupSidebarToggle();
      setupModeDropdown();
      setupScrollToBottom();
      setupInputShortcuts();
      greetOnOpen();
    });

    function setupSidebarToggle(){
      const app = document.getElementById('appContainer');
      const btn = document.getElementById('sidebarToggle');
      btn.addEventListener('click', () => {
        app.classList.toggle('collapsed');
      });
    }

    function setupModeDropdown(){
      const button = document.getElementById('modeButton');
      const menu = document.getElementById('modeMenu');
      const label = document.getElementById('modeLabel');

      button.addEventListener('click', () => {
        menu.classList.toggle('open');
      });

      menu.querySelectorAll('.mode-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const mode = btn.getAttribute('data-mode');
          chatMode = mode;
          label.textContent = mode === 'agent' ? 'Agent' : 'Ask';
          menu.classList.remove('open');

          if (mode === 'agent') {
            setAgentState(true, { announce: true });
          } else {
            setAgentState(false, { announce: true });
          }
        });
      });

      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !button.contains(e.target)) {
          menu.classList.remove('open');
        }
      });
    }

    function setupScrollToBottom(){
      const chatArea = document.getElementById('chatArea');
      const btn = document.getElementById('scrollToBottom');

      chatArea.addEventListener('scroll', () => {
        const nearBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 120;
        btn.classList.toggle('show', !nearBottom);
      });

      btn.addEventListener('click', () => {
        scrollToBottom();
      });
    }

    function setupInputShortcuts(){
      const input = document.getElementById('message-input');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    function greetOnOpen(){
      const localTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const greetingPrompt = `My local time is ${localTime}. Please greet me and ask how you can help today.`;
      showTyping();

      fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`
        },
        body: JSON.stringify({
          message: greetingPrompt,
          tradingMode,
          sessionId: sessionId,
          agentEnabled: false
        })
      })
      .then(res => {
        if (!res.ok) {
          throw new Error('Greeting request failed');
        }
        return res.json();
      })
      .then(data => {
        hideTyping();
        if (data?.response) {
          addBotMessage(data.response);
        }
      })
      .catch(() => {
        hideTyping();
        addBotMessage(`Hello! It's ${localTime} for you. How can I help today?`);
      });
    }

    function enableAutoGrowTextarea(){
      const ta = document.getElementById('message-input');
      const resize = () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
      };
      ta.addEventListener('input', resize);
      resize();
    }

    async function loadUserProfile() {
      try {
        const response = await fetch('/api/auth/verify', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!response.ok) {
          logout();
          return;
        }

        const data = await response.json();

        if (data.valid && data.user) {
          currentUser = data.user;
          document.getElementById('userName').textContent = data.user.username || 'User';
          document.getElementById('userEmail').textContent = data.user.email || '';
          document.getElementById('userAvatar').textContent =
            (data.user.username || data.user.email || 'U').charAt(0).toUpperCase();
        } else {
          logout();
        }
      } catch (error) {
        document.getElementById('userName').textContent = 'Error loading profile';
        document.getElementById('userEmail').textContent = 'Click to retry';
      }
    }

    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = '/';
    }

    function openTelegramSettings() {
      document.getElementById('telegramModal').classList.add('active');
      loadTelegramConfig();
    }

    function openBinanceSettings() {
      document.getElementById('binanceModal').classList.add('active');
      loadBinanceConfig();
    }

    function openTradingSettings() {
      document.getElementById('tradingModal').classList.add('active');
      loadTradingConfig();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    async function loadTelegramConfig() {
      try {
        const response = await fetch('/api/user/config', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();

        if (data.telegram_configured) {
          document.getElementById('telegram-token').value = '****************';
          document.getElementById('telegram-channel').value = data.telegram_channel_id || '';
        }
      } catch (error) {
        showToast('error', 'Failed to load Telegram settings');
      }
    }

    async function loadBinanceConfig() {
      try {
        const response = await fetch('/api/user/config', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();

        if (data.binance_configured) {
          document.getElementById('binance-key').value = '****************';
          document.getElementById('binance-secret').value = '****************';
          document.getElementById('binance-testnet').checked = !!data.binance_testnet;
        }
      } catch (error) {
        showToast('error', 'Failed to load Binance settings');
      }
    }

    async function loadTradingConfig() {
      try {
        const response = await fetch('/api/user/config', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();

        document.getElementById('trading-mode-select').value = data.trading_mode || 'paper';
        document.getElementById('default-leverage').value = data.default_leverage || 10;
        document.getElementById('max-position').value = data.max_position_size_usdt || 100;
      } catch (error) {
        showToast('error', 'Failed to load trading preferences');
      }
    }

    async function saveTelegramSettings(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('telegramStatus');
      const button = event.target.querySelector('button[type="submit"]');

      try {
        button.disabled = true;
        const response = await fetch('/api/user/config/telegram', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            telegram_bot_token: document.getElementById('telegram-token').value,
            telegram_channel_id: document.getElementById('telegram-channel').value
          })
        });

        if (response.ok) {
          statusDiv.innerHTML = '<div class="status-message">Telegram settings saved.</div>';
          showToast('info', 'Telegram settings saved');
          setTimeout(() => closeModal('telegramModal'), 1200);
        } else {
          statusDiv.innerHTML = '<div class="status-message error">Failed to save settings</div>';
          showToast('error', 'Failed to save Telegram settings');
        }
      } catch (error) {
        statusDiv.innerHTML = '<div class="status-message error">Network error</div>';
        showToast('error', 'Network error');
      } finally {
        button.disabled = false;
      }
    }

    async function saveBinanceSettings(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('binanceStatus');
      const button = event.target.querySelector('button[type="submit"]');

      try {
        button.disabled = true;
        const apiKey = document.getElementById('binance-key').value;
        const apiSecret = document.getElementById('binance-secret').value;
        const testnet = document.getElementById('binance-testnet').checked;

        const response = await fetch('/api/user/config/binance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            binance_api_key: apiKey,
            binance_api_secret: apiSecret,
            binance_testnet: testnet
          })
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.innerHTML = '<div class="status-message">Binance settings saved.</div>';
          showToast('info', 'Binance settings saved');
          setTimeout(() => closeModal('binanceModal'), 1200);
        } else {
          const errorMsg = data.error || 'Failed to save settings';
          statusDiv.innerHTML = `<div class="status-message error">${errorMsg}</div>`;
          showToast('error', errorMsg);
        }
      } catch (error) {
        statusDiv.innerHTML = '<div class="status-message error">Network error</div>';
        showToast('error', 'Network error');
      } finally {
        button.disabled = false;
      }
    }

    async function saveTradingSettings(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('tradingStatus');
      const button = event.target.querySelector('button[type="submit"]');

      try {
        button.disabled = true;
        const response = await fetch('/api/user/config/trading', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            trading_mode: document.getElementById('trading-mode-select').value,
            default_leverage: parseInt(document.getElementById('default-leverage').value, 10),
            max_position_size_usdt: parseFloat(document.getElementById('max-position').value)
          })
        });

        if (response.ok) {
          statusDiv.innerHTML = '<div class="status-message">Trading settings saved.</div>';
          showToast('info', 'Trading settings saved');
          setTimeout(() => closeModal('tradingModal'), 1200);
        } else {
          statusDiv.innerHTML = '<div class="status-message error">Failed to save settings</div>';
          showToast('error', 'Failed to save trading settings');
        }
      } catch (error) {
        statusDiv.innerHTML = '<div class="status-message error">Network error</div>';
        showToast('error', 'Network error');
      } finally {
        button.disabled = false;
      }
    }

    function setTradingMode(mode) {
      tradingMode = mode;
      document.getElementById('paperMode').classList.toggle('active', mode === 'paper');
      document.getElementById('liveMode').classList.toggle('active', mode === 'live');
    }

    function setAgentState(desired, options = { announce: true }) {
      if (agentRunning === desired) return;

      agentRunning = desired;

      if (options.announce) {
        if (agentRunning) {
          addBotMessage('Trading agent enabled. You can open positions and set alerts.');
          showToast('info', 'Agent enabled');
        } else {
          addBotMessage('Trading agent disabled.');
          showToast('info', 'Agent disabled');
        }
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'agent_state',
          enabled: agentRunning,
          mode: tradingMode
        }));
      }
    }

    function toggleAgent() {
      setAgentState(!agentRunning, { announce: true });
    }

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:3000/ws');

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'price') {
          updatePriceTicker(data.prices);
        }
      };

      ws.onerror = () => console.log('WebSocket error');
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    function updatePriceTicker(prices) {
      const btc = document.getElementById('btc-price');
      const eth = document.getElementById('eth-price');
      const bnb = document.getElementById('bnb-price');

      if (btc && prices.BTCUSDT) btc.textContent = '$' + prices.BTCUSDT.toLocaleString();
      if (eth && prices.ETHUSDT) eth.textContent = '$' + prices.ETHUSDT.toLocaleString();
      if (bnb && prices.BNBUSDT) bnb.textContent = '$' + prices.BNBUSDT.toLocaleString();
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-button');
      const message = input.value.trim();

      if (!message) return;

      addUserMessage(message);
      input.value = '';
      input.style.height = '46px';

      showTyping();
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            message,
            tradingMode,
            sessionId: sessionId,
            agentEnabled: chatMode === 'agent'
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          hideTyping();
          addBotMessage(`Error: ${errorData.error || 'Failed to send message'}`);
          showToast('error', 'Message failed');
          return;
        }

        const data = await response.json();
        hideTyping();
        addBotMessage(data.response, data.goal, data.goals);
      } catch (error) {
        hideTyping();
        addBotMessage('Sorry, I encountered an error. Please try again.');
        showToast('error', 'Network error');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function quickAction(message) {
      document.getElementById('message-input').value = message;
      sendMessage();
    }

    function addUserMessage(text) {
      const chatArea = document.getElementById('chatArea');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message user';
      messageDiv.innerHTML = `
        <div class="message-avatar">ME</div>
        <div>
          <div class="message-content">${escapeHtml(text)}</div>
          <div class="message-meta">${formatTime()}</div>
        </div>
      `;
      chatArea.insertBefore(messageDiv, chatArea.lastElementChild);
      scrollToBottom();
    }

    function addBotMessage(text, goal = null, goals = null) {
      const chatArea = document.getElementById('chatArea');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';

      let goalCard = '';

      if (goal) {
        goalCard = `
          <div class="goal-card">
            <div class="goal-card-header">
              <span>Goal Created</span>
              <span>${escapeHtml(String(goal.symbol || ''))}</span>
            </div>
            <div class="goal-card-details">
              ${escapeHtml(String(goal.condition || ''))} $${(goal.targetPrice ?? goal.target) ? Number(goal.targetPrice ?? goal.target).toLocaleString() : 'N/A'}<br>
              Mode: ${escapeHtml(String(goal.watchMode || goal.mode || ''))} | Auto-trade: ${goal.autoTrade ? 'Yes' : 'No'}<br>
              <small>ID: ${escapeHtml(String(goal.id || ''))}</small>
            </div>
          </div>
        `;
      }

      if (goals && goals.length > 0) {
        goalCard = goals.map(g => `
          <div class="goal-card">
            <div class="goal-card-header">
              <span>${escapeHtml(String(g.symbol || ''))}</span>
              <span class="goal-status">${escapeHtml(String(g.state || ''))}</span>
            </div>
            <div class="goal-card-details">
              ${escapeHtml(String(g.condition || ''))} $${g.targetPrice ? Number(g.targetPrice).toLocaleString() : 'N/A'}<br>
              Mode: ${escapeHtml(String(g.watchMode || ''))} | Triggers: ${escapeHtml(String(g.triggerCount || 0))}<br>
              <small>ID: ${escapeHtml(String(g.id || ''))}</small>
            </div>
          </div>
        `).join('');
      } else if (goals && goals.length === 0) {
        goalCard = `
          <div class="goal-card">
            <div class="goal-card-header">
              <span>No active goals</span>
              <span class="goal-status">Empty</span>
            </div>
            <div class="goal-card-details">
              Create one by saying: <em>"Alert me when BTC hits 50000"</em>
            </div>
          </div>
        `;
      }

      messageDiv.innerHTML = `
        <div class="message-avatar">AI</div>
        <div>
          <div class="message-content">${escapeHtml(text || '')}${goalCard}</div>
          <div class="message-meta">${formatTime()}</div>
        </div>
      `;
      chatArea.insertBefore(messageDiv, chatArea.lastElementChild);
      scrollToBottom();
      return messageDiv;
    }

    function showTyping() {
      document.getElementById('typingIndicator').classList.add('active');
      scrollToBottom();
    }

    function hideTyping() {
      document.getElementById('typingIndicator').classList.remove('active');
    }

    function scrollToBottom() {
      const chatArea = document.getElementById('chatArea');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(type, message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'error' ? 'error' : ''}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
  </script>
</body>
</html>
